name: Update YouTrack Issue State

on:
  pull_request_target:
    types: [ opened, reopened, ready_for_review, edited, closed ]

permissions:
  contents: read

jobs:
  update-state:
    name: Move issues to ${{ github.event.pull_request.merged && 'Fixed' || 'Ready for Review' }}
    runs-on: ubuntu-latest

    if: github.repository == 'ktorio/ktor' &&
      ((github.event.pull_request.state == 'open' && !github.event.pull_request.draft) ||
      (github.event.action == 'closed' && github.event.pull_request.merged))

    env:
      YOUTRACK_URL: https://youtrack.jetbrains.com
      YOUTRACK_TOKEN: ${{ secrets.YOUTRACK_TOKEN }}
      TARGET_STATE: ${{ github.event.pull_request.merged && 'Fixed' || 'Ready for Review' }}

    steps:
      - name: Check out the issue selection script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Collect issue IDs
        id: issues
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGES: ${{ toJson(github.event.changes) }}
        run: bash .github/scripts/collect-youtrack-issues.sh

      - name: Find target release
        id: release
        if: github.event.pull_request.merged && steps.issues.outputs.needs_release == 'true'
        env:
          TARGET_RELEASE: ${{ github.event.pull_request.milestone.title }}
        run: bash .github/scripts/find-youtrack-release.sh

      - name: Move issues to target state
        if: steps.issues.outputs.ids != ''
        env:
          ISSUE_IDS: ${{ steps.issues.outputs.ids }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          FAILED=0

          for ISSUE_ID in $ISSUE_IDS; do
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $YOUTRACK_TOKEN" \
              "$YOUTRACK_URL/api/issues/$ISSUE_ID?fields=resolved,customFields(name,value(name))")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" = "404" ]; then
              echo "::warning title=Unknown YouTrack issue::Issue $ISSUE_ID does not exist in YouTrack, skipping"
              continue
            fi

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Failed to get issue $ISSUE_ID (HTTP $HTTP_CODE): $BODY"
              FAILED=1
              continue
            fi

            STATE=$(echo "$BODY" | jq -r '.customFields[] | select(.name == "State") | .value.name // empty')
            RESOLVED=$(echo "$BODY" | jq -r '.resolved // empty')

            if [ "$STATE" = "$TARGET_STATE" ] || { [ -n "$RESOLVED" ] && [ "$TARGET_STATE" != "Fixed" ]; }; then
              echo "$ISSUE_ID is already in state '$STATE', skipping"
              continue
            fi

            RELEASE_TO_SET=""
            if [ "$TARGET_STATE" = "Fixed" ]; then
              ISSUE_TYPE=$(jq -r '.customFields[] | select(.name == "Type") | .value.name // empty' <<< "$BODY")
              case "$ISSUE_TYPE" in
                Bug|Feature|Task|"Security Problem"|Improvement)
                  if jq -e 'any(.customFields[]; .name == "Target release" and .value == null)' \
                    <<< "$BODY" > /dev/null; then
                    RELEASE_TO_SET="$RELEASE_ID"
                  fi
                  ;;
              esac
            fi

            PAYLOAD=$(jq -n \
              --arg state "$TARGET_STATE" \
              --arg release "$RELEASE_TO_SET" \
              '{
                customFields: ([
                  {
                    name: "State",
                    "$type": "StateIssueCustomField",
                    value: { name: $state }
                  }
                ] + (if $release != "" then [
                  {
                    name: "Target release",
                    "$type": "SingleEnumIssueCustomField",
                    value: { id: $release }
                  }
                ] else [] end))
              }')

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $YOUTRACK_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$YOUTRACK_URL/api/issues/$ISSUE_ID?fields=idReadable")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Failed to move issue $ISSUE_ID to '$TARGET_STATE' (HTTP $HTTP_CODE): $BODY"
              FAILED=1
              continue
            fi

            echo "Moved $ISSUE_ID: '$STATE' -> '$TARGET_STATE' ($YOUTRACK_URL/issue/$ISSUE_ID)"
          done

          exit "$FAILED"
